name: CI_CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ created ]
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  IMAGE_NAME: memory-card-flip
jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Build & Test
  # ──────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - name: Install JavaFX dependencies (headless)
        run: sudo apt-get install -y xvfb libgtk-3-0 libgl1-mesa-glx
      - name: Build with Maven
        run: mvn clean compile -B
      - name: Run Unit Tests (JUnit 5)
        run: xvfb-run mvn test -B -Dtest="**/model/**,**/service/**,**/repository/**"
      - name: Run Integration Tests (TestFX)
        run: xvfb-run mvn test -B -Dtest="**/ui/**"
        env:
          DISPLAY: ':99'
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
  # ──────────────────────────────────────────────
  # JOB 2: Code Quality
  # ──────────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - name: Checkstyle (Google Java Style)
        run: mvn checkstyle:check -B
      - name: SpotBugs static analysis
        run: mvn spotbugs:check -B
      - name: JaCoCo coverage report
        run: xvfb-run mvn jacoco:report -B
        continue-on-error: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
      - name: Check coverage threshold (75%)
        run: mvn jacoco:check -B
  # ──────────────────────────────────────────────
  # JOB 3: Docker Build & Push
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - name: Package JAR
        run: mvn clean package -B -DskipTests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image size (must be <= 400MB)
        run: |
          SIZE=$(docker image inspect ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest \
            --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 400 ]; then
            echo "ERROR: Image size ${SIZE_MB}MB exceeds 400MB limit"
            exit 1
          fi
  # ──────────────────────────────────────────────
  # JOB 4: Native Installer (jpackage) — release only
  # ──────────────────────────────────────────────
  package-installer:
    name: Build Native Installer
    runs-on: windows-latest
    needs: code-quality
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Build installer with jpackage
        run: mvn clean package -P production -B -DskipTests
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/installer/*.exe
      - name: Attach installer to release
        uses: softprops/action-gh-release@v1
        with:
          files: target/installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}